<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Query Processor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .product-card {
            border: 1px solid #374151; /* gray-700 */
            transition: all 0.2s ease-in-out;
        }
        .product-card:hover {
            border-color: #4f46e5; /* indigo-600 */
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-200">

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-2">E-commerce Query Processor</h1>
            <p class="text-lg text-gray-400">A mini search engine for your product data.</p>
        </header>

        <main>
            <!-- Query Input Section -->
            <div class="max-w-2xl mx-auto mb-6">
                <div class="flex items-center bg-gray-800 border border-gray-700 rounded-lg p-2 shadow-lg">
                    <input type="text" id="query-input" placeholder="e.g., Color:Blue or Weight:>300"
                        class="bg-transparent w-full text-white placeholder-gray-500 focus:outline-none px-4 py-2">
                    <button id="search-btn"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-md transition-colors duration-200">
                        Search
                    </button>
                </div>
            </div>

            <!-- Query Help Section -->
            <div class="max-w-2xl mx-auto bg-gray-800/50 p-4 rounded-lg text-sm text-gray-400 mb-8 border border-dashed border-gray-700">
                <h3 class="font-semibold text-white mb-2">How to Query:</h3>
                <ul class="list-disc list-inside space-y-1">
                    <li><span class="font-mono bg-gray-700 px-1 rounded">key:value</span> for case-insensitive text search (e.g., <code class="text-indigo-400">Fabric:Denim</code>).</li>
                    <li><span class="font-mono bg-gray-700 px-1 rounded">key:"exact value"</span> for exact matches (e.g., <code class="text-indigo-400">Type:"Back Cover"</code>).</li>
                    <li><span class="font-mono bg-gray-700 px-1 rounded">key&gt;value</span> or <span class="font-mono bg-gray-700 px-1 rounded">key&lt;value</span> for numeric search (e.g., <code class="text-indigo-400">Weight:&lt;400</code>).</li>
                </ul>
            </div>

            <!-- Results Section -->
            <div id="results-count" class="text-center mb-4 text-gray-400 font-medium"></div>
            <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Product cards will be inserted here -->
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const queryInput = document.getElementById('query-input');
            const searchBtn = document.getElementById('search-btn');
            const resultsContainer = document.getElementById('results-container');
            const resultsCount = document.getElementById('results-count');

            let products = [];

            // Load data from the JSON file
            fetch('./data-set.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    products = data;
                    displayMessage("Ready to search. Try a query above!");
                })
                .catch(error => {
                    console.error("Error loading product data:", error);
                    displayMessage("Error: Could not load product data. Please check the console.", true);
                });

            const performSearch = () => {
                const queryStr = queryInput.value;
                if (!queryStr.trim()) {
                    resultsContainer.innerHTML = '';
                    resultsCount.textContent = '';
                    return;
                }

                // Regex to parse the query: key, operator, quoted value, unquoted value
                const queryRegex = /^\s*([\w\s]+?)\s*([:><=]+)\s*(?:"([^"]*)"|(\S+))\s*$/;
                const match = queryStr.match(queryRegex);

                if (!match) {
                    displayMessage("Invalid query format. Please check the instructions.", true);
                    return;
                }

                const [, key, op, quotedVal, unquotedVal] = match;
                const value = quotedVal !== undefined ? quotedVal : unquotedVal;

                const filteredProducts = filterProducts(products, key.trim(), op, value);
                renderResults(filteredProducts);
            };
            
            const parseNumericValue = (val) => {
                if (typeof val === 'number') return val;
                if (typeof val !== 'string') return null;
                const match = val.match(/[-+]?\d*\.?\d+/);
                return match ? parseFloat(match[0]) : null;
            };

            const filterProducts = (data, key, op, value) => {
                const lowerCaseKey = key.toLowerCase();

                return data.filter(product => {
                    // Find the actual key in the product object, case-insensitively
                    const productKey = Object.keys(product).find(pk => pk.toLowerCase() === lowerCaseKey);
                    
                    if (productKey === undefined || product[productKey] == null) {
                        return false;
                    }
                    
                    const productValue = product[productKey];

                    // Numeric comparison
                    if (['>', '<', '>=', '<='].includes(op)) {
                        const productNum = parseNumericValue(productValue);
                        const queryNum = parseNumericValue(value);
                        
                        if (productNum === null || queryNum === null) return false;

                        switch (op) {
                            case '>': return productNum > queryNum;
                            case '<': return productNum < queryNum;
                            case '>=': return productNum >= queryNum;
                            case '<=': return productNum <= queryNum;
                            default: return false;
                        }
                    } 
                    // String comparison
                    else if (op === ':') {
                        const lowerCaseProductValue = String(productValue).toLowerCase();
                        const lowerCaseQueryValue = String(value).toLowerCase();
                        
                        // If query value was quoted, require an exact match
                        if (quotedVal !== undefined) {
                            return lowerCaseProductValue === lowerCaseQueryValue;
                        }
                        // Otherwise, check for inclusion
                        return lowerCaseProductValue.includes(lowerCaseQueryValue);
                    }
                    
                    return false;
                });
            };

            const renderResults = (results) => {
                resultsContainer.innerHTML = '';
                resultsCount.textContent = `Found ${results.length} product(s).`;
                
                if (results.length === 0) {
                    displayMessage("No products found matching your query.", false);
                    return;
                }

                results.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card bg-gray-800 rounded-lg p-4 flex flex-col';
                    
                    let cardContent = '';
                    for (const [key, value] of Object.entries(product)) {
                        if (key && value) { // Only display non-empty fields
                           cardContent += `
                                <div class="text-sm mb-1">
                                    <span class="font-semibold text-gray-400">${key}:</span>
                                    <span class="text-gray-200">${value}</span>
                                </div>
                           `;
                        }
                    }
                    card.innerHTML = cardContent;
                    resultsContainer.appendChild(card);
                });
            };

            const displayMessage = (message, isError = false) => {
                resultsContainer.innerHTML = '';
                const messageEl = document.createElement('div');
                messageEl.textContent = message;
                messageEl.className = `text-center w-full col-span-full py-8 ${isError ? 'text-red-400' : 'text-gray-500'}`;
                resultsContainer.appendChild(messageEl);
                 if(!isError) resultsCount.textContent = '';
            };


            searchBtn.addEventListener('click', performSearch);
            queryInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        });
    </script>
</body>

</html>
